name: DarkGame CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Compile, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify app
        run: npm run verify:app

  vercel-preview:
    name: Vercel Preview
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request'
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel preview environment
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel preview
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Vercel preview
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-testnet:
    name: Sepolia Contract Deploy
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    environment: testnet
    env:
      PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy DarkGame
        if: env.PRIVATE_KEY != '' && env.SEPOLIA_RPC_URL != ''
        run: npm run deploy:sepolia

      - name: Upload deployment metadata
        if: env.PRIVATE_KEY != '' && env.SEPOLIA_RPC_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: sepolia-deployment
          path: deployments/11155111.json
